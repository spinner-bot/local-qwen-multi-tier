# LiteLLM 网关：统一入口，按级别别名路由，失败自动降级
# 启动：litellm --config config/litellm.yaml --host 127.0.0.1 --port 8000
# 需要环境变量 LLM_API_KEY（与各 vLLM 实例一致）

model_list:
  - model_name: l1
    litellm_params:
      model: openai/l1
      api_base: http://127.0.0.1:8101/v1
      api_key: os.environ/LLM_API_KEY
  - model_name: l2
    litellm_params:
      model: openai/l2
      api_base: http://127.0.0.1:8102/v1
      api_key: os.environ/LLM_API_KEY
  - model_name: l3
    litellm_params:
      model: openai/l3
      api_base: http://127.0.0.1:8103/v1
      api_key: os.environ/LLM_API_KEY
  - model_name: l3q
    litellm_params:
      model: openai/l3q
      api_base: http://127.0.0.1:8103/v1
      api_key: os.environ/LLM_API_KEY
  - model_name: l4
    litellm_params:
      model: openai/l4
      api_base: http://127.0.0.1:8104/v1
      api_key: os.environ/LLM_API_KEY
  - model_name: l5
    litellm_params:
      model: openai/l5
      api_base: http://127.0.0.1:8110/v1
      api_key: os.environ/LLM_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 600
  fallbacks:
    - l5: ["l4", "l3", "l2", "l1"]
    - l4: ["l3", "l2", "l1"]
    - l3: ["l2", "l1"]
    - l3q: ["l3", "l2"]
    - l2: ["l1"]

litellm_settings:
  drop_params: true
  request_timeout: 600
